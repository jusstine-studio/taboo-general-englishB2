<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studio | TABOO B2</title><style>body{margin:0;background:#101b30;color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.wrap{width:min(92vw,720px);text-align:center}h1{letter-spacing:.2em;color:#ffc875;font-size:22px}.sub{color:#a9bbd4}.card{background:#fff;color:#15223a;border-radius:25px;padding:45px 20px;margin:30px 0;min-height:260px;box-shadow:0 20px 60px #0005}.word{font-size:clamp(34px,6vw,58px);font-weight:800;margin:14px 0 28px}.taboo{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.taboo span{background:#fff0e9;color:#9b3d27;padding:12px 17px;border-radius:12px;font-size:20px;font-weight:700}.tag{color:#a85d44;letter-spacing:.18em;font-size:13px;font-weight:bold}button{border:0;border-radius:14px;padding:17px 32px;font-size:19px;font-weight:bold;cursor:pointer;margin:5px}#toggle{background:#ffbd62;color:#172239;min-width:170px}#reset,#skip{background:#33445f;color:white}#skip{background:#415b75}button:disabled{opacity:.45;cursor:not-allowed}.status{color:#bbcadc;margin-top:12px}.hint{font-size:13px;color:#92a5c0}button:focus-visible{outline:3px solid #fff;outline-offset:3px}</style></head><body><main class="wrap"><h1>STUDIO · TABOO</h1><div class="sub">GENERAL ENGLISH · B2</div><section class="card" aria-live="off"><div class="tag">DESCRIBE WITHOUT SAYING</div><div id="word" class="word">READY?</div><div id="taboo" class="taboo"><span>Press PLAY</span></div></section><button id="toggle">▶ PLAY</button><button id="skip">↷ SKIP</button><button id="reset">↻ NEW GAME</button><div class="status" id="status">50 cards ready</div><p class="hint">Press SPACE to play / stop · STOP to describe · SKIP to spin again · No repeated cards</p></main><script>
const cards=[
['overwhelmed','stress','busy','too much'],['compromise','agree','middle','both'],['reliable','trust','depend','person'],['awkward','embarrassing','uncomfortable','situation'],['deadline','finish','time','work'],['reluctant','unwilling','hesitate','want'],['achievement','success','goal','proud'],['misunderstanding','confusion','wrong','communication'],['spontaneous','plan','sudden','unexpected'],['priority','important','first','urgent'],['setback','problem','progress','delay'],['persuasive','convince','argument','opinion'],['assumption','believe','proof','suppose'],['resilient','recover','difficult','strong'],['dilemma','choice','decision','two'],['consequence','result','action','happen'],['underestimate','less','expect','value'],['independent','alone','help','self'],['reputation','opinion','known','public'],['coincidence','chance','accident','same'],['frustrated','annoyed','angry','problem'],['adaptable','change','flexible','situation'],['opportunity','chance','possibility','job'],['hesitation','pause','unsure','decision'],['commitment','promise','responsibility','dedication'],['misleading','false','information','impression'],['resourceful','creative','solution','problem'],['boundary','limit','personal','line'],['procrastinate','delay','later','task'],['worthwhile','valuable','effort','time'],['open-minded','ideas','accept','different'],['prejudice','opinion','unfair','judge'],['curiosity','interest','questions','learn'],['bystander','watch','witness','incident'],['shortcoming','weakness','flaw','lack'],['outspoken','opinion','direct','speak'],['burnout','exhausted','work','stress'],['debt','money','owe','borrow'],['intuition','feeling','instinct','decision'],['empathy','feelings','understand','others'],['unpredictable','know','future','surprise'],['sceptical','doubt','believe','trust'],['breakthrough','discovery','progress','major'],['downside','disadvantage','negative','problem'],['obstacle','problem','difficulty','overcome'],['identity','name','person','who'],['misconception','wrong','belief','idea'],['self-conscious','appearance','embarrassed','people'],['ambition','success','goal','career'],['perspective','view','opinion','different']];
let remaining=[],current=null,timer=null,spinning=false;const word=document.getElementById('word'),taboo=document.getElementById('taboo'),toggle=document.getElementById('toggle'),status=document.getElementById('status');function display(i){let c=cards[i];word.textContent=c[0].toUpperCase();taboo.replaceChildren(...c.slice(1).map(t=>{let e=document.createElement('span');e.textContent=t;return e}))}function pick(){return remaining[Math.floor(Math.random()*remaining.length)]}function start(){if(!remaining.length){status.textContent='All cards completed! Start a new game.';return}spinning=true;toggle.textContent='■ STOP';document.getElementById('skip').disabled=true;timer=setInterval(()=>display(pick()),110);display(pick());status.textContent='Spinning…'}function stop(){clearInterval(timer);spinning=false;current=pick();display(current);remaining=remaining.filter(i=>i!==current);toggle.textContent='▶ PLAY';document.getElementById('skip').disabled=false;status.textContent=`${50-remaining.length} / 50 cards played · ${remaining.length} remaining`;if(!remaining.length)toggle.textContent='✓ FINISHED';document.getElementById('skip').disabled=!remaining.length}function reset(){clearInterval(timer);spinning=false;remaining=cards.map((_,i)=>i);current=null;word.textContent='READY?';taboo.innerHTML='<span>Press PLAY</span>';toggle.textContent='▶ PLAY';document.getElementById('skip').disabled=true;status.textContent='50 cards ready'}toggle.onclick=()=>spinning?stop():start();document.getElementById('reset').onclick=reset;document.getElementById('skip').onclick=()=>{if(spinning||current===null||!remaining.length)return;current=null;start()};document.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat){e.preventDefault();toggle.click()}});reset();</script></body></html>
